<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orchid Island Real Estate</title>
    <meta name="description" content="Orchid Island - Agence immobilière de luxe spécialisée dans la vente, acquisition et location de propriétés exclusives. The Address You'll Always Remember." />

    <!-- Préconnexion Railway — réduit le handshake TCP+TLS au premier fetch -->
    <link rel="preconnect" href="https://orchid-web-site-production.up.railway.app" />
    <link rel="dns-prefetch" href="https://orchid-web-site-production.up.railway.app" />

    <!-- Préconnexion Cloudinary -->
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <!-- Précharge de l'image LCP (hero-villa) -->
    <link
      rel="preload"
      as="image"
      href="https://res.cloudinary.com/drgg2rocc/image/upload/f_auto,q_auto:eco,w_1200,dpr_auto/v1781262920/pexels-iwashere-18320910_1_fv44s3.jpg"
      fetchpriority="high"
    />

    <!-- Métadonnées Open Graph et Twitter -->
    <meta name="orchid Island" content="orchid Island" />
    <meta property="og:title" content="Orchid Island - Luxury Real Estate" />
    <meta property="og:description" content="Agence immobilière de luxe spécialisée dans la vente, acquisition et location de propriétés exclusives." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://res.cloudinary.com/drgg2rocc/image/upload/f_auto,q_auto:eco,w_1200,dpr_auto/v1781262920/pexels-iwashere-18320910_1_fv44s3.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="https://x.com/EstateOrch47105" />
    <meta name="twitter:image" content="https://res.cloudinary.com/drgg2rocc/image/upload/f_auto,q_auto:eco,w_1200,dpr_auto/v1781262920/pexels-iwashere-18320910_1_fv44s3.jpg" />
    <meta http-equiv="x-dns-prefetch-control" content="on" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
